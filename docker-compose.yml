# ============================================================
# auto-apply-bot — pilha completa (bot + Chrome headful + noVNC).
#
# Use o atalho `./bin/jobbot up` — ele escolhe o modo certo sozinho e
# resolve as portas. Este arquivo existe para quem quiser o Docker puro.
#
# PORTAS (definidas no .env):
#   BOT_UI_PORT    → dashboard/control server (padrão 1717)
#   BOT_NOVNC_PORT → navegador remoto via noVNC (padrão 7900, só no modo local)
#   BOT_CDP_PORT   → porta CDP do Chrome do host (padrão 9222, só no modo host)
#
# Modos:
#   local  → Chrome DENTRO do container (login via noVNC)
#   host   → usa o Chrome do HOST (já logado) via network_mode: host
# ============================================================

name: auto-apply-bot

x-comum: &comum
  build: .
  image: auto-apply-bot:latest
  env_file:
    - .env
  volumes:
    # Perfil do Chrome (os logins persistem entre runs).
    - chrome-profile:/home/node/.chrome-profile
    # Estado e artefatos do bot.
    - bot-data:/app/data
    - bot-logs:/app/logs
    - bot-shots:/app/screenshots
    # Config e currículos vêm do host (dados pessoais, fora da imagem).
    - ./config:/app/config:ro
    - ./curriculos:/app/curriculos

services:
  # ---- Modo local: Chrome dentro do container -------------------------------
  # UI na BOT_UI_PORT, navegador remoto na BOT_NOVNC_PORT.
  # A porta CDP fica interna (o bot e o Chrome conversam dentro do container).
  bot:
    <<: *comum
    container_name: auto-apply-bot
    ports:
      - "${BOT_UI_PORT:-1717}:3000"
      - "${BOT_NOVNC_PORT:-7900}:7900"
    environment:
      DASHBOARD_HOST: 0.0.0.0
      CONTROL_MODE: "true"
      # "auto": usa o Chrome local; se apontar para um CDP remoto que não
      # responde, o entrypoint cai para o Chrome local.
      START_LOCAL_CHROME: "true"

  # ---- Modo host: usa o Chrome do host (já logado) --------------------------
  # Sobe com: docker compose --profile host-chrome up -d bot-host
  # (o atalho `./bin/jobbot up` faz isso sozinho quando detecta o CDP do host)
  bot-host:
    <<: *comum
    container_name: auto-apply-bot-host
    profiles: ["host-chrome"]
    network_mode: host
    environment:
      DASHBOARD_HOST: 127.0.0.1
      DASHBOARD_PORT: "${BOT_UI_PORT:-1717}"
      CONTROL_MODE: "true"
      CDP_ENDPOINT: "http://127.0.0.1:${BOT_CDP_PORT:-9222}"
      # "auto": tenta o Chrome do host e cai para o local se ele não responder.
      START_LOCAL_CHROME: "auto"

volumes:
  chrome-profile:
  bot-data:
  bot-logs:
  bot-shots:
