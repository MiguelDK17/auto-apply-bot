# Override: rodar o bot contra o Chrome do HOST (o mesmo que você usa, logado).
#
# Por que: o Chrome do host escuta em 127.0.0.1:9222 (só loopback), então o
# container não o alcança pela rede do bridge. Com `network_mode: host`
# (Linux) o container compartilha a rede do host — e 127.0.0.1:9222 passa a
# ser o SEU Chrome, com as sessões já logadas.
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.host-chrome.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.host-chrome.yml run --rm bot
#
# Requisitos no host: Chrome aberto com porta de debug (o perfil dedicado
# ~/.chrome-debug-profile OU o Chrome que você já usa, desde que esteja com
# --remote-debugging-port=9222).
#
# ATENÇÃO: neste modo o bot age no seu navegador real (é o ponto da coisa).
# Prefira DRY_RUN=true até confiar no fluxo.

services:
  bot:
    network_mode: host
    ports: !reset []          # host network ignora port mapping
    environment:
      # Mesmo loopback do host — e o do Chrome logado.
      CDP_ENDPOINT: http://127.0.0.1:9222
      # Não sobe Chrome local: usa o do host.
      START_LOCAL_CHROME: "false"
      # Mantém a porta 1717 do dashboard (em host network não há mapping,
      # então o app escuta direto na porta do host).
      DASHBOARD_PORT: "1717"
      DASHBOARD_HOST: 127.0.0.1
